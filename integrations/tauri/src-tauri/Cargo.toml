[package]
name = "carina-harness"
version = "0.10.0"
description = "Carina Harness desktop shell"
authors = ["Nebutra"]
edition = "2021"
license = "MIT"
publish = false

# Keep the desktop shell independent from Carina's root workspace. Tauri owns
# its platform-specific dependency graph and is packaged separately.
[workspace]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.7"
url = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
