[package]
name = "carina-tui"
version = "0.8.24"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
arboard.workspace = true
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm.workspace = true
image.workspace = true
libc = "0.2"
pulldown-cmark = "0.13"
ratatui = { workspace = true, features = ["unstable-backend-writer", "unstable-rendered-line-info"] }
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }
thiserror.workspace = true
tempfile.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
xai-ratatui-inline = { path = "../xai-ratatui-inline", features = ["scrolling-regions"] }
xai-ratatui-textarea = { path = "../xai-ratatui-textarea" }

[dev-dependencies]
insta = "1"
vt100 = "0.15"

[[bin]]
name = "carina-ui"
path = "src/bin/carina-ui.rs"

[[bin]]
name = "tui_bench"
path = "src/bin/tui_bench.rs"
