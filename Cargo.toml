[workspace]
resolver = "2"
members = [
    "crates/carina-kernel",
    "crates/carina-policy",
    "crates/carina-patch",
    "crates/carina-audit",
    "crates/carina-plugin-runtime",
    "crates/carina-index",
    "crates/carina-tui",
    "crates/xai-ratatui-inline",
    "crates/xai-ratatui-textarea",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Nebutra/carina"

[workspace.dependencies]
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tempfile = "3"
toml = "0.8"
time = { version = "0.3", features = ["formatting", "serde", "serde-well-known"] }
rusqlite = { version = "0.32", features = ["bundled"] }
streaming-iterator = "0.1"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
carina-kernel = { path = "crates/carina-kernel" }
carina-policy = { path = "crates/carina-policy" }
carina-patch = { path = "crates/carina-patch" }
carina-audit = { path = "crates/carina-audit" }
carina-plugin-runtime = { path = "crates/carina-plugin-runtime" }
carina-index = { path = "crates/carina-index" }
anstyle-parse = "0.2"
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
ratatui = { version = "0.29", features = ["crossterm", "unstable-widget-ref"] }
ratatui-core = "0.1"
textwrap = "0.16"
tui-scrollbar = "0.2"
unicode-segmentation = "1.12"
unicode-width = "0.2"
